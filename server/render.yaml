services:
  - type: web
    name: rioparana-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: APP_API_KEY
        sync: false
      - key: PGSSL
        value: require
      - key: DATABASE_URL
        fromDatabase:
          name: rioparana-db
          property: connectionString
# NOTE: scheduled data refresh (river/news scraping) is handled for free by the
# GitHub Actions workflow .github/workflows/refresh.yml, which POSTs /refresh
# every 15 min and keeps the free web service awake. If you later prefer a
# native paid Render Cron Job instead, add a `- type: cron` service here running
# `npm run refresh` on `*/15 * * * *` (requires a paid plan + payment method).
databases:
  - name: rioparana-db
    plan: free
