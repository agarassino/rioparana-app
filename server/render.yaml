services:
  - type: web
    name: rioparana-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: APP_API_KEY
        sync: false
      - key: PGSSL
        value: require
      - key: DATABASE_URL
        fromDatabase:
          name: rioparana-db
          property: connectionString
  - type: cron
    name: rioparana-refresh
    runtime: node
    rootDir: server
    plan: starter
    schedule: "*/15 * * * *"
    buildCommand: npm ci && npm run build
    startCommand: npm run refresh
    envVars:
      - key: PGSSL
        value: require
      - key: DATABASE_URL
        fromDatabase:
          name: rioparana-db
          property: connectionString
databases:
  - name: rioparana-db
    plan: free
