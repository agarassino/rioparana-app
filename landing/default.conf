server {
    listen 80;
    server_name _;
    charset utf-8;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/geo+json application/xml image/svg+xml;

    # Serve .geojson as JSON so it gzips and parses cleanly
    location ~* \.geojson$ {
        default_type application/json;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
