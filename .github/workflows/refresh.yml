name: refresh-backend-data
on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min (GitHub best-effort timing)
  workflow_dispatch: {}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend refresh
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "x-api-key: ${{ secrets.APP_API_KEY }}" \
            -H "x-refresh-token: ${{ secrets.REFRESH_TOKEN }}" \
            "${{ secrets.API_BASE_URL }}/refresh")
          echo "refresh HTTP $code"
          test "$code" = "200"
