name: landing-freshness

# Watchdog for the baked river readings on /rio/*.
#
# The daily refresh runs from launchd on the founder's Mac (see
# refresh-river.yml for why). When it breaks, nothing complains: visitors still
# see live numbers because the page JS fetches the API, while the HTML that
# search engines and AI crawlers read keeps an old date. That went unnoticed
# for 12 days in September 2026.
#
# This job lives on GitHub on purpose, so it still fires when the Mac is off.
# It only reads public pages, so it needs no secrets. A failed scheduled run
# emails whoever last edited the cron line.

on:
  schedule:
    # 16:00 UTC = 13:00 ART, after the 09:30 refresh and its retry window.
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the newest baked reading
        env:
          # Busy stations that report daily; one silent station must not page.
          STATIONS: rosario parana corrientes san-pedro zarate
          HUB_URL: https://rioparana.com.ar/rio/
          MAX_AGE_DAYS: '2'
        run: |
          set -euo pipefail
          newest=''
          for s in $STATIONS; do
            d=$(curl -fsS --max-time 20 "https://rioparana.com.ar/rio/$s/" \
              | grep -oE 'del <time datetime="[0-9]{4}-[0-9]{2}-[0-9]{2}"' \
              | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1 || true)
            echo "$s: ${d:-no date found}"
            if [ -n "$d" ] && [[ "$d" > "$newest" ]]; then newest=$d; fi
          done

          if [ -z "$newest" ]; then
            echo "::error::No reading date found on any locality page. Did the markup change?"
            exit 1
          fi

          today=$(TZ=America/Argentina/Buenos_Aires date +%F)
          days_old() { echo $(( ( $(date -ud "$today" +%s) - $(date -ud "$1" +%s) ) / 86400 )); }

          age=$(days_old "$newest")
          echo "Newest locality reading: $newest ($age days old, limit $MAX_AGE_DAYS)"
          if [ "$age" -gt "$MAX_AGE_DAYS" ]; then
            echo "::error::Baked river readings are $age days old. Check the launchd job com.syloper.cartera-refresh and ~/Library/Logs/cartera-refresh.log on the Mac."
            exit 1
          fi

          # The hub is checked on its own, not folded into the newest date
          # above: the refresh regenerates it in a separate step whose failure
          # does not fail the run, so fresh locality pages could otherwise
          # hide a hub frozen on an old date. It bakes one <time> per station
          # row, so the newest row is the one that counts.
          hub=$(curl -fsS --max-time 20 "$HUB_URL" \
            | grep -oE '<time datetime="[0-9]{4}-[0-9]{2}-[0-9]{2}"' \
            | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort | tail -1 || true)
          if [ -z "$hub" ]; then
            echo "::error::No reading date found on the /rio/ hub. Did the markup change?"
            exit 1
          fi
          hub_age=$(days_old "$hub")
          echo "Hub /rio/ newest row: $hub ($hub_age days old, limit $MAX_AGE_DAYS)"
          if [ "$hub_age" -gt "$MAX_AGE_DAYS" ]; then
            echo "::error::The /rio/ hub is $hub_age days old while locality pages are fresh. The hub step of scripts/refresh-river-landing.mjs is failing; see ~/Library/Logs/cartera-refresh.log on the Mac."
            exit 1
          fi
